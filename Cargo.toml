[workspace]
resolver = "3"
members = ["crates/ipc-proto", "crates/config-gen"]
# По мере готовности добавляются: crates/platform, crates/helper, crates/app (ТЗ §3).

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
ipc-proto = { path = "crates/ipc-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
ipnet = "2.12.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
